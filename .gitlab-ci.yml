stages:
  - build
  - deploy
variables:
  DOCKER_REGISTRY: "registry.beamewa.com.vn"
  DOCKER_IMAGE: "$DOCKER_REGISTRY/beam-uat/cms-frontend"
  DOCKER_TAG: "$CI_COMMIT_SHA"
.dev-env-module:
  variables:
    ENV: dev
    ENV_FILE: .env.dev
.uat-env-module:
  variables:
    ENV: uat 
    ENV_FILE: .env.uat
.build-module:
  allow_failure: false
  when: manual
  script:
    - docker build --build-arg ENV_FILE=$ENV_FILE -t $DOCKER_IMAGE-$ENV:$CI_COMMIT_SHA .
    - docker push -t $DOCKER_IMAGE-$ENV:$CI_COMMIT_SHA .
.deploy-module:
  allow_failure: false
  script:
    - docker service update --with-registry-auth --image $DOCKER_IMAGE-$ENV:$CI_COMMIT_SHA beam_cms
build-dev:
  stage: build
  extends:
    - .dev-env-module
    - .build-module
build-uat:
  stage: build
  extends:
    - .uat-env-module
    - .build-module
deploy-dev:
  stage: deploy
  extends:
    - .dev-env-module
    - .deploy-module
  needs: ["build-dev"]
deploy-uat:
  stage: deploy
  extends:
    - .uat-env-module
    - .deploy-module
  needs: ["build-uat"]