stages:
  - security
  - notify

# ---------------------------------------------------------------------------
# Security scan (Trivy) → thông báo Halo
# Chạy trên shared runner (Docker executor) của gitlab.com, không cần tag.
# CI/CD variables cần khai (Settings → CI/CD → Variables, Masked):
#   HALO_BOT_TOKEN, HALO_CONVERSATION_UUID, (tuỳ chọn) HALO_API_BASE
# ---------------------------------------------------------------------------

trivy-scan:
  stage: security
  image:
    # Pin cả digest: từng có bản Trivy bị chèn mã độc (0.69.4–0.69.6).
    name: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    entrypoint: [""]
  variables:
    TRIVY_SCANNERS: "vuln,secret,misconfig"
    TRIVY_SEVERITY: "MEDIUM,HIGH,CRITICAL"
    TRIVY_SKIP_DIRS: "node_modules,dist,dev-dist,.yarn,.trivycache,security-reports"
    TRIVY_CACHE_DIR: ".trivycache"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SKIP_VERSION_CHECK: "true"
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  script:
    - mkdir -p security-reports/trivy
    - trivy fs --format json --output security-reports/trivy/trivy-report.json .
    - >
      trivy convert --format table
      --output security-reports/trivy/trivy-report.txt
      security-reports/trivy/trivy-report.json
    - cat security-reports/trivy/trivy-report.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security-reports/trivy/

halo-notify:
  stage: notify
  image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
  # Luôn chạy, kể cả khi trivy-scan lỗi (khi đó báo "không có báo cáo").
  when: always
  needs:
    - job: trivy-scan
      artifacts: true
  variables:
    # Job fail (pipeline đỏ) khi có lỗi ở các mức này.
    TRIVY_FAIL_SEVERITY: "CRITICAL"
  script:
    - node scripts/security/trivy-halo-notify.mjs security-reports/trivy/trivy-report.json
