stages:
  - build
  - deploy
variables:
  DOCKER_REGISTRY: "registry.beamewa.com.vn"
  DOCKER_IMAGE: "$DOCKER_REGISTRY/beam-uat/cms-frontend"
  DOCKER_TAG: "$CI_COMMIT_SHA"
.dev-env-module:
  variables:
    ENV: dev
    ENV_FILE: .env.dev
.uat-env-module:
  variables:
    ENV: uat 
    ENV_FILE: .env.uat
.deploy-module:
  allow_failure: false
  script:
    - docker service update --with-registry-auth --image $DOCKER_IMAGE:$CI_COMMIT_SHA beam_cms
build-module:
  allow_failure: false
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
  tags:
    - beam_ci
deploy-dev:
  stage: deploy
  extends:
    - .deploy-module
  needs: ["build-dev"]
  tags:
    - beam_cd_dev
deploy-uat:
  stage: deploy
  extends:
    - .deploy-module
  needs: ["build-uat"]
  tags:
    - beam_cd_uat