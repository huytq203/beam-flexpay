server {
  listen 8000;
  server_name localhost;
  root /usr/share/nginx/html;

  index index.html index.htm;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check endpoint for ALB
  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}